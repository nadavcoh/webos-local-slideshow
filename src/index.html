<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080, user-scalable=no" />
  <title>Ambient Photos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============================================================
       PAIRING SCREEN
       Shown on first run (no persisted Supabase session) and again
       if the session is ever cleared (Log Out, or an invalid/expired
       refresh token). The QR sends the phone to this app's own
       Next.js web app's /tv-login page, which handles GitHub SSO via
       Supabase and hands the resulting tokens back to us via the
       tv-poll endpoint. There's no picker/media-selection step
       anymore — photos come from the wa/hashes tables directly.
       ============================================================ -->
  <div id="pairing-screen" class="screen hidden">
    <div class="pairing-card">
      <h1 class="pairing-title">Ambient Photos</h1>

      <div id="pairing-step-connect" class="pairing-step">
        <p class="pairing-instructions">
          On your phone, scan this to connect your account:
        </p>
        <div id="connect-qr" class="pairing-qr"></div>
        <p class="pairing-url" id="connect-url">&nbsp;</p>
        <p class="pairing-status" id="connect-status">Preparing&hellip;</p>
      </div>

      <div id="pairing-error" class="pairing-error hidden"></div>
    </div>
  </div>

  <!-- ============================================================
       SLIDESHOW VIEW
       Two stacked <img> layers are cross-faded between; only one
       is ever visible/opaque at a time. This avoids any flash of
       blank screen between images.
       ============================================================ -->
  <div id="slideshow-screen" class="screen hidden">
    <img id="layer-a" class="photo-layer" alt="" />
    <img id="layer-b" class="photo-layer" alt="" />
    <div class="vignette"></div>
    <div id="overlay" class="overlay">
      <span id="overlay-date" class="overlay-date"></span>
      <span id="overlay-location" class="overlay-location"></span>
    </div>

    <!-- Hidden until any remote button is pressed during playback.
         Back/Escape dismisses, and it auto-hides after a few seconds
         of inactivity either way. OK activates natively. -->
    <div id="menu-overlay" class="menu-overlay hidden">
      <div class="menu-card">
        <button id="menu-logout" class="menu-btn" type="button">Log Out</button>
      </div>
      <p class="menu-hint">OK to select &nbsp;&middot;&nbsp; Back to dismiss</p>
    </div>
  </div>

  <!-- Invisible 1x1, silently looping video. webOS's screensaver
       explicitly exempts active video playback (see appinfo.json's
       "enablePigScreenSaver" docs) — unlike the tvpower Luna service,
       this needs no special permission a third-party .ipk might lack. -->
  <video id="keepalive" src="keepalive.mp4" muted autoplay loop playsinline></video>

  <div id="boot-screen" class="screen">
    <div class="boot-spinner"></div>
  </div>

  <!-- Tiny QR renderer -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Supabase JS, UMD build — exposes window.supabase.createClient.
       No bundler/ES-modules step in this plain webOS app, so the CDN
       build (not the npm package) is the right fit here. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- HEIC/HEIF decode (WASM build of libheif), vendored locally
       rather than CDN-loaded — see vendor/libheif/VENDORED.md.
       heic-worker.js loads its own copy of this same file via
       importScripts(); this main-thread copy (window.libheif) is only
       used as a fallback if that worker can't start — see
       getHeicWorker()/decodeHeicOnMainThread() in app.js. -->
  <script src="vendor/libheif/libheif-bundle.js"></script>
  <!-- Local-only overrides for WEBAPP_URL / SUPABASE_URL /
       SUPABASE_ANON_KEY / PHOTO_SERVER_URL when testing with
       `npx serve .`. Copy secrets.local.js.example to secrets.local.js
       (gitignored) and fill in real values. Harmlessly 404s if that
       file doesn't exist — app.js just falls back to its placeholder
       strings, which the GitHub Action fills in for real builds.
       Never packaged into the .ipk (see the ares-package
       --app-exclude flags in README.md). -->
  <script src="secrets.local.js"></script>
  <script src="app.js"></script>
</body>
</html>
